worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name ops-demo.local;
        root /var/www/html;

        location /api/ {
            proxy_pass http://backend;
            proxy_read_timeout 5s;
            proxy_connect_timeout 2s;
        }
    }
}
